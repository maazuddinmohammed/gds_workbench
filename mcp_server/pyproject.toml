[project]
name = "gds-etl-workbench-mcp"
version = "0.2.0"
description = "GDS ETL Workbench MCP App Service"
requires-python = ">=3.14,<3.15"
dependencies = [
    "databricks-sql-connector==4.4.0",
    "gunicorn==26.0.0",
    "mcp==2.0.0",
    "psycopg[binary]==3.3.4",
    "psycopg-pool==3.3.1",
    "pydantic==2.13.4",
    "sqlglot==30.13.0",
    "uvicorn==0.51.0",
    "uvicorn-worker==0.4.0",
    "aiohttp==3.14.3",
    "azure-identity==1.25.3",
    "azure-storage-blob==12.30.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pyright==1.1.411",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.22",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests/mcp"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC"]

[tool.pyright]
include = ["gds_etl_workbench"]
extraPaths = ["../load_and_merge_scripts"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gds_etl_workbench"]
