[project]
name = "gds-workbench-mcp-bridge"
version = "0.1.0"
description = "Local stdio bridge for the authenticated GDS Workbench MCP server"
requires-python = ">=3.12,<3.13"
dependencies = [
    "azure-identity==1.25.3",
    "httpx2==2.9.1",
    "mcp==2.0.0",
]

[project.scripts]
gds-workbench-bridge = "gds_workbench_bridge.__main__:main"

[dependency-groups]
dev = [
    "pyright==1.1.411",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.22",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests/bridge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC"]

[tool.pyright]
include = ["gds_workbench_bridge", "../tests/bridge"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gds_workbench_bridge"]
