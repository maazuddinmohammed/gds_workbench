name: GDS Workbench Databricks App

on:
  pull_request:
    paths:
      - ".github/workflows/web-app.yml"
      - "app.yaml"
      - "database/**"
      - "databricks.yml"
      - "databricks_notebooks/**"
      - "deployment/**"
      - "docs/**"
      - "mcp_server/**"
      - "package-lock.json"
      - "package.json"
      - "pyproject.toml"
      - "tests/web_backend/**"
      - "tests/mcp/**"
      - "tests/web_packaging/**"
      - "uv.lock"
      - "web_app/**"
  push:
    paths:
      - ".github/workflows/web-app.yml"
      - "app.yaml"
      - "database/**"
      - "databricks.yml"
      - "databricks_notebooks/**"
      - "deployment/**"
      - "docs/**"
      - "mcp_server/**"
      - "package-lock.json"
      - "package.json"
      - "pyproject.toml"
      - "tests/web_backend/**"
      - "tests/mcp/**"
      - "tests/web_packaging/**"
      - "uv.lock"
      - "web_app/**"

permissions:
  contents: read

concurrency:
  group: web-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-and-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install package manager
        run: python -m pip install uv==0.10.2
      - name: Verify frozen MCP dependencies
        run: uv sync --frozen --project mcp_server
      - name: Test MCP and disposable PostgreSQL contracts
        run: >-
          uv run --frozen --project mcp_server python -m pytest
          -c mcp_server/pyproject.toml tests/mcp
      - name: Check MCP formatting
        run: >-
          uv run --frozen --project mcp_server ruff format --check
          mcp_server/gds_etl_workbench
      - name: Check MCP lint
        run: >-
          uv run --frozen --project mcp_server ruff check
          mcp_server/gds_etl_workbench
      - name: Check MCP types
        run: uv run --frozen --project mcp_server pyright --project mcp_server

  backend-and-packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Databricks Apps package manager
        run: python -m pip install uv==0.10.2
      - name: Verify frozen dependencies
        run: uv sync --frozen
      - name: Test backend
        run: >-
          uv run --frozen --project web_app/backend python -m pytest
          -c web_app/backend/pyproject.toml tests/web_backend
      - name: Test deployment packaging
        run: >-
          uv run --frozen --project web_app/backend python -m pytest
          -c web_app/backend/pyproject.toml tests/web_packaging
      - name: Check formatting
        working-directory: web_app/backend
        run: uv run --frozen ruff format --check gds_workbench_api gds_workbench_runtime
      - name: Check lint
        working-directory: web_app/backend
        run: uv run --frozen ruff check gds_workbench_api gds_workbench_runtime
      - name: Check types
        run: uv run --frozen --project web_app/backend pyright --project web_app/backend

  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package manager
        run: python -m pip install uv==0.10.2
      - name: Install pinned notebook dependencies
        run: |
          uv venv --python 3.12 .venv-notebooks
          uv pip install --python .venv-notebooks/bin/python --requirement databricks_notebooks/requirements-dev.txt
      - name: Test source-import notebooks
        env:
          PYTHONPATH: databricks_notebooks/src:mcp_server:web_app/backend
        run: .venv-notebooks/bin/python -m pytest databricks_notebooks/tests
      - name: Probe extracted artifact on Databricks Python
        run: >-
          .venv-notebooks/bin/python -m pytest
          tests/web_packaging/test_databricks_ui_artifacts.py::test_generated_notebook_python_is_valid_for_databricks_runtime_16_4
          tests/web_packaging/test_databricks_ui_artifacts.py::test_every_packaged_notebook_module_imports_from_the_extracted_artifact
          tests/web_packaging/test_databricks_ui_artifacts.py::test_extracted_notebook_shared_workflow_runtime_assembles_from_source
      - name: Check notebook lint and format
        run: |
          .venv-notebooks/bin/ruff check --config databricks_notebooks/ruff.toml databricks_notebooks
          .venv-notebooks/bin/ruff format --check --config databricks_notebooks/ruff.toml databricks_notebooks
      - name: Check notebook types for Python 3.12
        run: >-
          .venv-notebooks/bin/pyright --project databricks_notebooks
          --pythonpath .venv-notebooks/bin/python

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - name: Install frozen dependencies
        run: npm ci
      - name: Test and build frontend
        run: npm run check
