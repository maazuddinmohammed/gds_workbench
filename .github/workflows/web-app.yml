name: GDS Workbench Databricks App

on:
  pull_request:
    paths:
      - ".github/workflows/web-app.yml"
      - "app.yaml"
      - "database/**"
      - "databricks.yml"
      - "deployment/**"
      - "docs/**"
      - "mcp_server/**"
      - "package-lock.json"
      - "package.json"
      - "pyproject.toml"
      - "tests/web_backend/**"
      - "tests/mcp/**"
      - "tests/web_packaging/**"
      - "uv.lock"
      - "web_app/**"
  push:
    paths:
      - ".github/workflows/web-app.yml"
      - "app.yaml"
      - "database/**"
      - "databricks.yml"
      - "deployment/**"
      - "docs/**"
      - "mcp_server/**"
      - "package-lock.json"
      - "package.json"
      - "pyproject.toml"
      - "tests/web_backend/**"
      - "tests/mcp/**"
      - "tests/web_packaging/**"
      - "uv.lock"
      - "web_app/**"

permissions:
  contents: read

concurrency:
  group: web-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-and-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install package manager
        run: python -m pip install uv==0.10.2
      - name: Verify frozen MCP dependencies
        run: uv sync --frozen --project mcp_server
      - name: Test MCP and disposable PostgreSQL contracts
        run: >-
          uv run --frozen --project mcp_server python -m pytest
          -c mcp_server/pyproject.toml tests/mcp
      - name: Check MCP formatting
        run: >-
          uv run --frozen --project mcp_server ruff format --check
          mcp_server/gds_etl_workbench
      - name: Check MCP lint
        run: >-
          uv run --frozen --project mcp_server ruff check
          mcp_server/gds_etl_workbench
      - name: Check MCP types
        run: uv run --frozen --project mcp_server pyright --project mcp_server

  backend-and-packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Databricks Apps package manager
        run: python -m pip install uv==0.10.2
      - name: Verify frozen dependencies
        run: uv sync --frozen
      - name: Test backend
        run: >-
          uv run --frozen --project web_app/backend python -m pytest
          -c web_app/backend/pyproject.toml tests/web_backend
      - name: Test deployment packaging
        run: >-
          uv run --frozen --project web_app/backend python -m pytest
          -c web_app/backend/pyproject.toml tests/web_packaging
      - name: Check formatting
        working-directory: web_app/backend
        run: uv run --frozen ruff format --check gds_workbench_api
      - name: Check lint
        working-directory: web_app/backend
        run: uv run --frozen ruff check gds_workbench_api
      - name: Check types
        run: uv run --frozen --project web_app/backend pyright --project web_app/backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - name: Install frozen dependencies
        run: npm ci
      - name: Test and build frontend
        run: npm run check
