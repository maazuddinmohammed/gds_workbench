name: Atlas Windows smoke

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "mcp_server/**"
      - "atlas/**"
      - "tests/atlas/**"
      - ".gitattributes"
      - ".github/workflows/plugin-windows.yml"

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: atlas/atlas-bridge/package-lock.json
      - name: Install Atlas Local Workbench test dependencies
        run: npm ci
      - name: Test Atlas Local Workbench
        run: node --test tests/atlas/*.test.mjs
      - name: Install frozen Atlas Bridge dependencies
        working-directory: atlas/atlas-bridge
        run: npm ci
      - name: Test Atlas Bridge
        working-directory: atlas/atlas-bridge
        run: npm test
      - name: Type-check Atlas Bridge
        working-directory: atlas/atlas-bridge
        run: npm run check
      - name: Build Atlas Bridge VSIX
        working-directory: atlas/atlas-bridge
        run: npm run package:vsix

  powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Atlas Local Workbench form test dependencies
        run: npm ci
      - name: Install package manager
        run: python -m pip install uv==0.10.2
      - name: Verify frozen MCP dependencies
        run: uv sync --frozen --project mcp_server
      - name: Install and test Atlas Bridge on Windows
        working-directory: atlas/atlas-bridge
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run compile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify exported Atlas package in native Windows
        shell: powershell
        run: |
          uv run --frozen --project mcp_server python -m pytest -c mcp_server/pyproject.toml tests/atlas/test_packaging.py --tb=no --show-capture=no -q
      - name: Test Atlas native workspace parity with Windows PowerShell 5.1
        shell: powershell
        run: |
          $env:ATLAS_POWERSHELL = (Get-Command powershell.exe).Source
          uv run --frozen --project mcp_server --with pytest-xdist==3.8.0 --with execnet==2.1.2 python -m pytest -c mcp_server/pyproject.toml tests/atlas/test_native_parity.py tests/atlas/test_profiling_native.py tests/atlas/test_profiling_runtime.py tests/atlas/test_native_quality.py tests/atlas/test_native_policy.py tests/atlas/test_native_sql.py tests/atlas/test_handoff.py -q -n auto
