name: GDS plugin Windows smoke

on:
  pull_request:
  push:
    paths:
      - "plugins/v2/**"
      - "plugins/build_gds_v2_plugin_zip.py"
      - "tests/plugin_v2/**"
      - ".github/workflows/plugin-windows.yml"

permissions:
  contents: read

jobs:
  powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install test dependencies
        run: python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0
      - name: Test the V2 plugin with Windows PowerShell 5.1
        run: python -m pytest tests/plugin_v2 -q
