name: GDS plugin Windows smoke

on:
  pull_request:
  push:
    paths:
      - "mcp_server/**"
      - "plugins/v2/**"
      - "plugins/build_gds_v2_plugin_zip.py"
      - "tests/plugin_v2/**"
      - ".github/workflows/plugin-windows.yml"

permissions:
  contents: read

jobs:
  stage-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: plugins/v2/gds-stage-runner/package-lock.json
      - name: Install Workbench test dependencies
        run: npm ci
      - name: Test Workbench
        run: node --test tests/plugin_v2/*.test.mjs
      - name: Install frozen Stage Runner dependencies
        working-directory: plugins/v2/gds-stage-runner
        run: npm ci
      - name: Test Stage Runner
        working-directory: plugins/v2/gds-stage-runner
        run: npm test
      - name: Type-check Stage Runner
        working-directory: plugins/v2/gds-stage-runner
        run: npm run check
      - name: Build Stage Runner VSIX
        working-directory: plugins/v2/gds-stage-runner
        run: npm run package:vsix

  powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Workbench form test dependencies
        run: npm ci
      - name: Install package manager
        run: python -m pip install uv==0.10.2
      - name: Verify frozen MCP dependencies
        run: uv sync --frozen --project mcp_server
      - name: Test the V2 plugin with Windows PowerShell 5.1
        run: >-
          uv run --frozen --project mcp_server python -m pytest
          -c mcp_server/pyproject.toml tests/plugin_v2 -q
