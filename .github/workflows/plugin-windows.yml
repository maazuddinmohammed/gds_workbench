name: Atlas Windows smoke

on:
  pull_request:
  push:
    paths:
      - "mcp_server/**"
      - "atlas/**"
      - "tests/atlas/**"
      - ".github/workflows/plugin-windows.yml"

permissions:
  contents: read

jobs:
  stage-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: atlas/atlas-vs-code/package-lock.json
      - name: Install Workbench test dependencies
        run: npm ci
      - name: Test Atlas Workbench
        run: node --test tests/atlas/*.test.mjs
      - name: Install frozen Atlas Stage Runner dependencies
        working-directory: atlas/atlas-vs-code
        run: npm ci
      - name: Test Atlas Stage Runner
        working-directory: atlas/atlas-vs-code
        run: npm test
      - name: Type-check Atlas Stage Runner
        working-directory: atlas/atlas-vs-code
        run: npm run check
      - name: Build Atlas Stage Runner VSIX
        working-directory: atlas/atlas-vs-code
        run: npm run package:vsix

  powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Workbench form test dependencies
        run: npm ci
      - name: Install package manager
        run: python -m pip install uv==0.10.2
      - name: Verify frozen MCP dependencies
        run: uv sync --frozen --project mcp_server
      - name: Test Atlas native workspace parity with Windows PowerShell 5.1
        shell: powershell
        run: |
          $env:ATLAS_POWERSHELL = (Get-Command powershell.exe).Source
          uv run --frozen --project mcp_server python -m pytest -c mcp_server/pyproject.toml tests/atlas/test_native_parity.py tests/atlas/test_profiling_native.py tests/atlas/test_profiling_runtime.py tests/atlas/test_native_quality.py tests/atlas/test_native_policy.py tests/atlas/test_native_sql.py tests/atlas/test_handoff.py -q
