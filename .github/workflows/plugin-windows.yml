name: Atlas Windows smoke

on:
  pull_request:
  push:
    paths:
      - "mcp_server/**"
      - "atlas/**"
      - "tests/atlas/**"
      - ".github/workflows/plugin-windows.yml"

permissions:
  contents: read

jobs:
  stage-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: atlas/atlas-vs-code/package-lock.json
      - name: Install Atlas Local Workbench test dependencies
        run: npm ci
      - name: Test Atlas Local Workbench
        run: node --test tests/atlas/*.test.mjs
      - name: Install frozen Atlas Stage Runner dependencies
        working-directory: atlas/atlas-vs-code
        run: npm ci
      - name: Test Atlas Stage Runner
        working-directory: atlas/atlas-vs-code
        run: npm test
      - name: Type-check Atlas Stage Runner
        working-directory: atlas/atlas-vs-code
        run: npm run check
      - name: Build Atlas Stage Runner VSIX
        working-directory: atlas/atlas-vs-code
        run: npm run package:vsix
      - name: Verify dependency-free bridge launcher
        working-directory: atlas/atlas-connector
        run: node atlas-connector.cjs --help

  powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Atlas Local Workbench form test dependencies
        run: npm ci
      - name: Install package manager
        run: python -m pip install uv==0.10.2
      - name: Verify frozen MCP dependencies
        run: uv sync --frozen --project mcp_server
      - name: Install pinned Codex CLI for exported plugin verification
        run: npm install --global @openai/codex@0.147.0
      - name: Install and test both Stage Runner hosts on Windows
        working-directory: atlas/atlas-vs-code
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run compile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify dependency-free bridge launcher on Windows
        working-directory: atlas/atlas-connector
        run: node atlas-connector.cjs --help
      - name: Verify exported Atlas package in native Windows
        shell: powershell
        run: |
          codex --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen --project mcp_server python -m pytest -c mcp_server/pyproject.toml tests/atlas/test_packaging.py tests/atlas/test_connector_update.py --tb=no --show-capture=no -q
      - name: Test Atlas native workspace parity with Windows PowerShell 5.1
        shell: powershell
        run: |
          $env:ATLAS_POWERSHELL = (Get-Command powershell.exe).Source
          uv run --frozen --project mcp_server python -m pytest -c mcp_server/pyproject.toml tests/atlas/test_native_parity.py tests/atlas/test_profiling_native.py tests/atlas/test_profiling_runtime.py tests/atlas/test_native_quality.py tests/atlas/test_native_policy.py tests/atlas/test_native_sql.py tests/atlas/test_handoff.py -q
