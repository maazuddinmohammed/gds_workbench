            ON lower(btrim(system_record.system_code)) = lower(btrim(staged.system_code::text))
          JOIN core.copy_group AS copy_group
            ON copy_group.tenant_id = tenant.tenant_id
           AND copy_group.system_id = system_record.system_id
           AND lower(btrim(copy_group.copy_group_name)) =
               lower(btrim(staged.copy_group_name::text))
          LEFT JOIN core.member_group AS member_group
            ON NULLIF(btrim(staged.member_group_name::text), '') IS NOT NULL
           AND member_group.tenant_id = tenant.tenant_id
           AND member_group.system_id = system_record.system_id
           AND lower(btrim(member_group.member_group_name)) =
               lower(btrim(staged.member_group_name::text))
          WHERE NULLIF(btrim(staged.member_group_name::text), '') IS NULL
             OR member_group.member_group_id IS NOT NULL
        ) AS source
        ON target.copy_group_id = source.copy_group_id
        AND target.member_group_id IS NOT DISTINCT FROM source.member_group_id
        WHEN MATCHED THEN UPDATE SET
          tenant_id = source.tenant_id,
          system_id = source.system_id,
          copy_group_control_initial_load_date = source.copy_group_control_initial_load_date,
          copy_group_control_last_run_time = source.copy_group_control_last_run_time,
          copy_group_control_last_run_value = source.copy_group_control_last_run_value,
          updated_time = CURRENT_TIMESTAMP,
          updated_by = CURRENT_USER
        WHEN NOT MATCHED THEN INSERT (
          copy_group_id, member_group_id, tenant_id, system_id,
          copy_group_control_initial_load_date,
          copy_group_control_last_run_time, copy_group_control_last_run_value
        ) VALUES (
          source.copy_group_id, source.member_group_id, source.tenant_id,
          source.system_id, source.copy_group_control_initial_load_date,
          source.copy_group_control_last_run_time,
          source.copy_group_control_last_run_value
        );

  - workbook: operational.xlsx
    sheet: Copy
    schema: core
    table: copy
    dependency_order: 370
    columns:
      - tenant_code
      - system_code
      - copy_group_name
      - source_tenant_code
      - source_system_code
      - source_connection_code
      - source_object_schema
      - source_object_name
      - target_tenant_code
      - target_system_code
      - target_connection_code
      - target_object_schema
      - target_object_name
      - copy_source_record_limit
      - copy_source_record_limit_attribute
      - chunk_type_name
      - copy_source_initial_sql_script
      - copy_source_incremental_sql_script
      - copy_source_file_name
      - copy_source_file_pattern
      - copy_source_file_delimiter
      - source_file_type_name
      - copy_source_order
      - source_data_operation_name
      - target_data_operation_name
      - is_active
    required_columns:
      - tenant_code
      - system_code
      - copy_group_name
      - source_tenant_code
      - source_system_code
      - source_connection_code
      - source_object_schema
      - source_object_name
      - target_tenant_code
      - target_system_code
      - target_connection_code
      - target_object_schema
      - target_object_name
      - copy_source_order
      - source_data_operation_name
      - target_data_operation_name
    source_key:
      - tenant_code
      - system_code
      - copy_group_name
      - source_tenant_code
      - source_system_code
      - source_connection_code
      - source_object_schema
      - source_object_name
      - target_tenant_code
      - target_system_code
      - target_connection_code
      - target_object_schema
      - target_object_name
    merge_statements:
      - |
        MERGE INTO core.copy AS target
        USING (
          SELECT
            copy_group.copy_group_id,
            object_mapping.ingestion_object_mapping_id,
            NULLIF(btrim(staged.copy_source_record_limit::text), '')::bigint AS copy_source_record_limit,
            NULLIF(btrim(staged.copy_source_record_limit_attribute::text), '') AS copy_source_record_limit_attribute,
            chunk_type.chunk_type_id,
            NULLIF(staged.copy_source_initial_sql_script::text, '') AS copy_source_initial_sql_script,
            NULLIF(staged.copy_source_incremental_sql_script::text, '') AS copy_source_incremental_sql_script,
            NULLIF(staged.copy_source_file_name::text, '') AS copy_source_file_name,
            NULLIF(staged.copy_source_file_pattern::text, '') AS copy_source_file_pattern,
            NULLIF(staged.copy_source_file_delimiter::text, '') AS copy_source_file_delimiter,
            file_type.file_type_id AS source_file_type_id,
            btrim(staged.copy_source_order::text)::integer AS copy_source_order,
            source_operation.data_operation_id AS source_data_operation_id,
            target_operation.data_operation_id AS target_data_operation_id,
            COALESCE(NULLIF(btrim(staged.is_active::text), '')::boolean, TRUE) AS is_active
          FROM {staging_table} AS staged
          JOIN core.tenant AS copy_tenant
            ON lower(btrim(copy_tenant.tenant_code)) = lower(btrim(staged.tenant_code::text))
          JOIN core.system AS copy_system
            ON lower(btrim(copy_system.system_code)) = lower(btrim(staged.system_code::text))
          JOIN core.copy_group AS copy_group
            ON copy_group.tenant_id = copy_tenant.tenant_id
           AND copy_group.system_id = copy_system.system_id
           AND lower(btrim(copy_group.copy_group_name)) =
               lower(btrim(staged.copy_group_name::text))
          JOIN core.tenant AS source_tenant
            ON lower(btrim(source_tenant.tenant_code)) =
               lower(btrim(staged.source_tenant_code::text))
          JOIN core.system AS source_system
            ON lower(btrim(source_system.system_code)) =
               lower(btrim(staged.source_system_code::text))
          JOIN core.connection AS source_connection
            ON source_connection.tenant_id = source_tenant.tenant_id
           AND source_connection.system_id = source_system.system_id
           AND lower(btrim(source_connection.connection_code)) =
               lower(btrim(staged.source_connection_code::text))
          JOIN core.object AS source_object
            ON source_object.connection_id = source_connection.connection_id
           AND lower(btrim(source_object.object_schema)) =
               lower(btrim(staged.source_object_schema::text))
           AND lower(btrim(source_object.object_name)) =
               lower(btrim(staged.source_object_name::text))
          JOIN core.tenant AS target_tenant
            ON lower(btrim(target_tenant.tenant_code)) =
               lower(btrim(staged.target_tenant_code::text))
          JOIN core.system AS target_system
            ON lower(btrim(target_system.system_code)) =
               lower(btrim(staged.target_system_code::text))
          JOIN core.connection AS target_connection
            ON target_connection.tenant_id = target_tenant.tenant_id
           AND target_connection.system_id = target_system.system_id
           AND lower(btrim(target_connection.connection_code)) =
               lower(btrim(staged.target_connection_code::text))
          JOIN core.object AS target_object
            ON target_object.connection_id = target_connection.connection_id
           AND lower(btrim(target_object.object_schema)) =
               lower(btrim(staged.target_object_schema::text))
           AND lower(btrim(target_object.object_name)) =
               lower(btrim(staged.target_object_name::text))
          JOIN core.ingestion_object_mapping AS object_mapping
            ON object_mapping.source_object_id = source_object.object_id
           AND object_mapping.target_object_id = target_object.object_id
          LEFT JOIN reference.chunk_type AS chunk_type
            ON NULLIF(btrim(staged.chunk_type_name::text), '') IS NOT NULL
           AND lower(btrim(chunk_type.chunk_type_name)) =
               lower(btrim(staged.chunk_type_name::text))
          LEFT JOIN reference.file_type AS file_type
            ON NULLIF(btrim(staged.source_file_type_name::text), '') IS NOT NULL
           AND lower(btrim(file_type.file_type_name)) =
               lower(btrim(staged.source_file_type_name::text))
          JOIN reference.data_operation AS source_operation
            ON lower(btrim(source_operation.data_operation_name)) =
               lower(btrim(staged.source_data_operation_name::text))
          JOIN reference.data_operation AS target_operation
            ON lower(btrim(target_operation.data_operation_name)) =
               lower(btrim(staged.target_data_operation_name::text))
          WHERE (
            NULLIF(btrim(staged.chunk_type_name::text), '') IS NULL
            OR chunk_type.chunk_type_id IS NOT NULL
          ) AND (
            NULLIF(btrim(staged.source_file_type_name::text), '') IS NULL
            OR file_type.file_type_id IS NOT NULL
          )
        ) AS source
        ON target.copy_group_id = source.copy_group_id
        AND target.ingestion_object_mapping_id = source.ingestion_object_mapping_id
        WHEN MATCHED THEN UPDATE SET
          copy_source_record_limit = source.copy_source_record_limit,
          copy_source_record_limit_attribute = source.copy_source_record_limit_attribute,
          chunk_type_id = source.chunk_type_id,
          copy_source_initial_sql_script = source.copy_source_initial_sql_script,
          copy_source_incremental_sql_script = source.copy_source_incremental_sql_script,
          copy_source_file_name = source.copy_source_file_name,
          copy_source_file_pattern = source.copy_source_file_pattern,
          copy_source_file_delimiter = source.copy_source_file_delimiter,
          source_file_type_id = source.source_file_type_id,
          copy_source_order = source.copy_source_order,
          source_data_operation_id = source.source_data_operation_id,
          target_data_operation_id = source.target_data_operation_id,
          is_active = source.is_active,
          updated_time = CURRENT_TIMESTAMP,
          updated_by = CURRENT_USER
        WHEN NOT MATCHED THEN INSERT (
          copy_group_id, ingestion_object_mapping_id,
          copy_source_record_limit, copy_source_record_limit_attribute,
          chunk_type_id, copy_source_initial_sql_script,
          copy_source_incremental_sql_script, copy_source_file_name,
          copy_source_file_pattern, copy_source_file_delimiter,
          source_file_type_id, copy_source_order, source_data_operation_id,
          target_data_operation_id, is_active
        ) VALUES (
          source.copy_group_id, source.ingestion_object_mapping_id,
          source.copy_source_record_limit,
          source.copy_source_record_limit_attribute, source.chunk_type_id,
          source.copy_source_initial_sql_script,
          source.copy_source_incremental_sql_script,
          source.copy_source_file_name, source.copy_source_file_pattern,
          source.copy_source_file_delimiter, source.source_file_type_id,
          source.copy_source_order, source.source_data_operation_id,
          source.target_data_operation_id, source.is_active
        );

  - workbook: operational.xlsx
    sheet: ProcessGroup
    schema: core
    table: process_group
    dependency_order: 380
    columns:
      - tenant_code
      - system_code
      - zone_code
      - process_group_name
      - process_group_description
      - copy_group_name
      - is_active
    required_columns:
      - tenant_code
      - system_code
      - zone_code
      - process_group_name
      - copy_group_name
    source_key: [tenant_code, system_code, zone_code, process_group_name]
    merge_statements:
      - |
        MERGE INTO core.process_group AS target
        USING (
          SELECT
            tenant.tenant_id,
            system_record.system_id,
            zone.zone_id,
            btrim(staged.process_group_name::text) AS process_group_name,
            NULLIF(btrim(staged.process_group_description::text), '') AS process_group_description,
            copy_group.copy_group_id,
            COALESCE(NULLIF(btrim(staged.is_active::text), '')::boolean, TRUE) AS is_active
          FROM {staging_table} AS staged
          JOIN core.tenant AS tenant
            ON lower(btrim(tenant.tenant_code)) = lower(btrim(staged.tenant_code::text))
          JOIN core.system AS system_record
            ON lower(btrim(system_record.system_code)) = lower(btrim(staged.system_code::text))
          JOIN reference.zone AS zone
            ON lower(btrim(zone.zone_code)) = lower(btrim(staged.zone_code::text))
          JOIN core.copy_group AS copy_group
            ON copy_group.tenant_id = tenant.tenant_id
           AND copy_group.system_id = system_record.system_id
           AND lower(btrim(copy_group.copy_group_name)) =
               lower(btrim(staged.copy_group_name::text))
        ) AS source
        ON target.tenant_id = source.tenant_id
        AND target.system_id = source.system_id
        AND target.zone_id = source.zone_id
        AND lower(btrim(target.process_group_name)) = lower(source.process_group_name)
        WHEN MATCHED THEN UPDATE SET
          process_group_description = source.process_group_description,
          copy_group_id = source.copy_group_id,
          is_active = source.is_active,
          updated_time = CURRENT_TIMESTAMP,
          updated_by = CURRENT_USER
        WHEN NOT MATCHED THEN INSERT (
          tenant_id, system_id, zone_id, process_group_name,
          process_group_description, copy_group_id, is_active
        ) VALUES (
          source.tenant_id, source.system_id, source.zone_id,
          source.process_group_name, source.process_group_description,
          source.copy_group_id, source.is_active
        );

  - workbook: operational.xlsx
    sheet: Process
    schema: core
    table: process
    dependency_order: 390
    columns:
      - process_group_tenant_code
      - process_group_system_code
      - process_group_zone_code
      - process_group_name
      - object_tenant_code
      - object_system_code
      - object_connection_code
      - object_schema
      - object_name
      - process_execution_order
      - process_location
      - process_executable
      - process_type_name
      - is_active
    required_columns:
      - process_group_tenant_code
      - process_group_system_code
      - process_group_zone_code
      - process_group_name
      - object_tenant_code
      - object_system_code
      - object_connection_code
      - object_schema
      - object_name
      - process_execution_order
      - process_location
      - process_executable
      - process_type_name
    source_key:
      - process_group_tenant_code
      - process_group_system_code
      - process_group_zone_code
      - process_group_name
      - process_execution_order
      - process_location
      - process_executable
    case_sensitive_key_columns:
      - process_location
      - process_executable
    merge_statements:
      - |
        MERGE INTO core.process AS target
        USING (
          SELECT
            object_connection.connection_id,
            object_record.object_id,
            btrim(staged.process_execution_order::text)::integer AS process_execution_order,
            staged.process_location::text AS process_location,
            staged.process_executable::text AS process_executable,
            process_type.process_type_id,
            process_group.process_group_id,
            COALESCE(NULLIF(btrim(staged.is_active::text), '')::boolean, TRUE) AS is_active
          FROM {staging_table} AS staged
          JOIN core.tenant AS group_tenant
            ON lower(btrim(group_tenant.tenant_code)) =
               lower(btrim(staged.process_group_tenant_code::text))
          JOIN core.system AS group_system
            ON lower(btrim(group_system.system_code)) =
               lower(btrim(staged.process_group_system_code::text))
          JOIN reference.zone AS group_zone
            ON lower(btrim(group_zone.zone_code)) =
               lower(btrim(staged.process_group_zone_code::text))
          JOIN core.process_group AS process_group
            ON process_group.tenant_id = group_tenant.tenant_id
           AND process_group.system_id = group_system.system_id
           AND process_group.zone_id = group_zone.zone_id
           AND lower(btrim(process_group.process_group_name)) =
               lower(btrim(staged.process_group_name::text))
          JOIN core.tenant AS object_tenant
            ON lower(btrim(object_tenant.tenant_code)) =
               lower(btrim(staged.object_tenant_code::text))
          JOIN core.system AS object_system
            ON lower(btrim(object_system.system_code)) =
               lower(btrim(staged.object_system_code::text))
          JOIN core.connection AS object_connection
            ON object_connection.tenant_id = object_tenant.tenant_id
           AND object_connection.system_id = object_system.system_id
           AND lower(btrim(object_connection.connection_code)) =
               lower(btrim(staged.object_connection_code::text))
          JOIN core.object AS object_record
            ON object_record.connection_id = object_connection.connection_id
           AND lower(btrim(object_record.object_schema)) =
               lower(btrim(staged.object_schema::text))
           AND lower(btrim(object_record.object_name)) =
               lower(btrim(staged.object_name::text))
          JOIN reference.process_type AS process_type
            ON lower(btrim(process_type.process_type_name)) =
               lower(btrim(staged.process_type_name::text))
        ) AS source
        ON target.process_group_id = source.process_group_id
        AND target.process_execution_order = source.process_execution_order
        AND target.process_location = source.process_location
        AND target.process_executable = source.process_executable
        WHEN MATCHED THEN UPDATE SET
          connection_id = source.connection_id,
          object_id = source.object_id,
          process_type_id = source.process_type_id,
          is_active = source.is_active,
          updated_time = CURRENT_TIMESTAMP,
          updated_by = CURRENT_USER
        WHEN NOT MATCHED THEN INSERT (
          connection_id, object_id, process_execution_order, process_location,
          process_executable, process_type_id, process_group_id, is_active
        ) VALUES (
          source.connection_id, source.object_id, source.process_execution_order,
          source.process_location, source.process_executable,
          source.process_type_id, source.process_group_id, source.is_active
        );

