            ON lower(btrim(tenant.tenant_code)) = lower(btrim(staged.tenant_code::text))
          JOIN core.system AS system_record
            ON lower(btrim(system_record.system_code)) = lower(btrim(staged.system_code::text))
          JOIN core.connection AS connection
            ON connection.tenant_id = tenant.tenant_id
           AND connection.system_id = system_record.system_id
           AND lower(btrim(connection.connection_code)) =
               lower(btrim(staged.connection_code::text))
          JOIN reference.environment AS environment
            ON lower(btrim(environment.environment_code)) =
               lower(btrim(staged.environment_code::text))
          JOIN reference.connection_parameter AS parameter
            ON lower(btrim(parameter.connection_parameter_code)) =
               lower(btrim(staged.connection_parameter_code::text))
        ) AS source
        ON target.connection_id = source.connection_id
        AND target.environment_id = source.environment_id
        AND target.connection_parameter_id = source.connection_parameter_id
        WHEN MATCHED THEN UPDATE SET
          connection_value = source.connection_value,
          updated_time = CURRENT_TIMESTAMP,
          updated_by = CURRENT_USER
        WHEN NOT MATCHED THEN INSERT (
          environment_id, connection_id, connection_parameter_id, connection_value
        ) VALUES (
          source.environment_id, source.connection_id,
          source.connection_parameter_id, source.connection_value
