      - object_type_code
      - zone_code
    source_key:
      - tenant_code
      - system_code
      - connection_code
      - object_schema
      - object_name
    merge_statements:
      - |
        MERGE INTO core.object AS target
        USING (
          SELECT
            connection.connection_id,
            btrim(staged.object_schema::text) AS object_schema,
            btrim(staged.object_name::text) AS object_name,
            NULLIF(btrim(staged.fc_object_schema::text), '') AS fc_object_schema,
            NULLIF(btrim(staged.fc_object_name::text), '') AS fc_object_name,
            NULLIF(staged.object_transformation::text, '') AS object_transformation,
            NULLIF(btrim(staged.object_description::text), '') AS object_description,
            NULLIF(btrim(staged.batch_attribute_name::text), '') AS batch_attribute_name,
            object_type.object_type_id,
            zone.zone_id,
            COALESCE(NULLIF(btrim(staged.is_active::text), '')::boolean, TRUE) AS is_active
          FROM {staging_table} AS staged
          JOIN core.tenant AS tenant
            ON lower(btrim(tenant.tenant_code)) = lower(btrim(staged.tenant_code::text))
          JOIN core.system AS system_record
            ON lower(btrim(system_record.system_code)) = lower(btrim(staged.system_code::text))
          JOIN core.connection AS connection
            ON connection.tenant_id = tenant.tenant_id
           AND connection.system_id = system_record.system_id
           AND lower(btrim(connection.connection_code)) =
               lower(btrim(staged.connection_code::text))
          JOIN reference.object_type AS object_type
            ON lower(btrim(object_type.object_type_code)) =
               lower(btrim(staged.object_type_code::text))
          JOIN reference.zone AS zone
            ON lower(btrim(zone.zone_code)) = lower(btrim(staged.zone_code::text))
          LEFT JOIN core.object AS existing_object
            ON existing_object.connection_id = connection.connection_id
           AND lower(btrim(existing_object.object_schema)) =
               lower(btrim(staged.object_schema::text))
           AND lower(btrim(existing_object.object_name)) =
               lower(btrim(staged.object_name::text))
          WHERE NOT COALESCE(existing_object.is_locked, FALSE)
        ) AS source
        ON target.connection_id = source.connection_id
        AND lower(btrim(target.object_schema)) = lower(source.object_schema)
        AND lower(btrim(target.object_name)) = lower(source.object_name)
        WHEN MATCHED THEN UPDATE SET
          fc_object_schema = source.fc_object_schema,
          fc_object_name = source.fc_object_name,
          object_transformation = source.object_transformation,
          object_description = source.object_description,
          batch_attribute_name = source.batch_attribute_name,
          object_type_id = source.object_type_id,
          zone_id = source.zone_id,
          is_active = source.is_active,
          updated_time = CURRENT_TIMESTAMP,
          updated_by = CURRENT_USER
        WHEN NOT MATCHED THEN INSERT (
          connection_id, object_schema, object_name, fc_object_schema,
          fc_object_name, object_transformation, object_description,
          batch_attribute_name, object_type_id, zone_id, is_active
        ) VALUES (
          source.connection_id, source.object_schema, source.object_name,
          source.fc_object_schema, source.fc_object_name,
          source.object_transformation, source.object_description,
          source.batch_attribute_name, source.object_type_id,
          source.zone_id, source.is_active
        );

