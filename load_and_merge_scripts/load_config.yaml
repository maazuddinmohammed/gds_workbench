  - workbook: reference.xlsx
    sheet: Pipeline
    schema: reference
    table: pipeline
    dependency_order: 140
    columns:
      - pipeline_name
      - pipeline_description
      - parent_pipeline_name
    required_columns: [pipeline_name]
    source_key: [pipeline_name]
    merge_statements:
      - |
        MERGE INTO reference.pipeline AS target
        USING (
          SELECT
            btrim(staged.pipeline_name::text) AS pipeline_name,
            NULLIF(btrim(staged.pipeline_description::text), '') AS pipeline_description
          FROM {staging_table} AS staged
        ) AS source
        ON lower(btrim(target.pipeline_name)) = lower(source.pipeline_name)
        WHEN MATCHED THEN UPDATE SET
          pipeline_description = source.pipeline_description,
          updated_time = CURRENT_TIMESTAMP,
          updated_by = CURRENT_USER
        WHEN NOT MATCHED THEN INSERT (
          pipeline_name, pipeline_description, parent_pipeline_name
        ) VALUES (
          source.pipeline_name, source.pipeline_description, NULL
        );
    deferred_statements:
      - |
        MERGE INTO reference.pipeline AS target
        USING (
          SELECT
            btrim(staged.pipeline_name::text) AS pipeline_name,
            CASE
              WHEN NULLIF(btrim(staged.parent_pipeline_name::text), '') IS NULL
                THEN NULL
              WHEN parent.pipeline_id IS NOT NULL
                THEN parent.pipeline_name
              ELSE '<unresolved-parent>'
            END AS parent_pipeline_name
          FROM {staging_table} AS staged
          LEFT JOIN reference.pipeline AS parent
            ON NULLIF(btrim(staged.parent_pipeline_name::text), '') IS NOT NULL
           AND lower(btrim(parent.pipeline_name)) = lower(btrim(staged.parent_pipeline_name::text))
        ) AS source
        ON lower(btrim(target.pipeline_name)) = lower(source.pipeline_name)
        WHEN MATCHED THEN UPDATE SET
          parent_pipeline_name = source.parent_pipeline_name,
          updated_time = CURRENT_TIMESTAMP,
          updated_by = CURRENT_USER;

