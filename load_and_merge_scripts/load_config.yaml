  - workbook: foundational.xlsx
    sheet: System
    schema: core
    table: system
    dependency_order: 200
    columns:
      - system_code
      - system_name
      - system_description
      - system_type_code
      - is_active
    required_columns: [system_code, system_name, system_type_code]
    source_key: [system_code]
    merge_statements:
      - |
        MERGE INTO core.system AS target
        USING (
          SELECT
            btrim(staged.system_code::text) AS system_code,
            btrim(staged.system_name::text) AS system_name,
            NULLIF(btrim(staged.system_description::text), '') AS system_description,
            system_type.system_type_id,
            COALESCE(NULLIF(btrim(staged.is_active::text), '')::boolean, TRUE) AS is_active
          FROM {staging_table} AS staged
          JOIN reference.system_type AS system_type
