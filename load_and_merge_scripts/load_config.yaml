        );

  - workbook: model.xlsx
    sheet: ModelScope
    schema: model
    table: model_scope
    dependency_order: 410
    columns:
      - model_tenant_code
      - model_name
      - object_tenant_code
      - object_system_code
      - object_connection_code
      - object_schema
      - object_name
    required_columns:
      - model_tenant_code
      - model_name
      - object_tenant_code
      - object_system_code
      - object_connection_code
      - object_schema
      - object_name
    source_key:
      - model_tenant_code
      - model_name
      - object_tenant_code
      - object_system_code
      - object_connection_code
      - object_schema
      - object_name
    merge_statements:
      - |
        MERGE INTO model.model_scope AS target
        USING (
          SELECT
            model_record.model_id,
            object_record.object_id
          FROM {staging_table} AS staged
          JOIN core.tenant AS model_tenant
            ON lower(btrim(model_tenant.tenant_code)) =
               lower(btrim(staged.model_tenant_code::text))
           AND model_tenant.is_active
          JOIN model.model AS model_record
            ON model_record.tenant_id = model_tenant.tenant_id
           AND lower(btrim(model_record.model_name)) =
               lower(btrim(staged.model_name::text))
           AND model_record.is_active
          JOIN core.tenant AS object_tenant
            ON lower(btrim(object_tenant.tenant_code)) =
               lower(btrim(staged.object_tenant_code::text))
           AND object_tenant.is_active
          JOIN core.system AS object_system
            ON lower(btrim(object_system.system_code)) =
               lower(btrim(staged.object_system_code::text))
           AND object_system.is_active
          JOIN core.connection AS object_connection
            ON object_connection.tenant_id = object_tenant.tenant_id
           AND object_connection.system_id = object_system.system_id
           AND lower(btrim(object_connection.connection_code)) =
               lower(btrim(staged.object_connection_code::text))
           AND object_connection.is_active
          JOIN core.object AS object_record
            ON object_record.connection_id = object_connection.connection_id
           AND lower(btrim(object_record.object_schema)) =
               lower(btrim(staged.object_schema::text))
           AND lower(btrim(object_record.object_name)) =
               lower(btrim(staged.object_name::text))
           AND object_record.is_active
        ) AS source
        ON target.model_id = source.model_id
        AND target.object_id = source.object_id
        WHEN MATCHED THEN UPDATE SET
          is_active = TRUE,
          updated_time = CURRENT_TIMESTAMP,
          updated_by = CURRENT_USER
        WHEN NOT MATCHED THEN INSERT (model_id, object_id)
        VALUES (source.model_id, source.object_id);
