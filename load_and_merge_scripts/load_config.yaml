version: 1
loads:
  - workbook: reference.xlsx
    sheet: Environment
    schema: reference
    table: environment
    dependency_order: 10
    columns:
      - environment_code
      - environment_name
      - environment_description
      - is_active
    required_columns: [environment_code, environment_name]
    source_key: [environment_code]
    merge_statements:
      - |
        MERGE INTO reference.environment AS target
        USING (
          SELECT
            btrim(staged.environment_code::text) AS environment_code,
            btrim(staged.environment_name::text) AS environment_name,
            NULLIF(btrim(staged.environment_description::text), '') AS environment_description,
            COALESCE(NULLIF(btrim(staged.is_active::text), '')::boolean, TRUE) AS is_active
          FROM {staging_table} AS staged
        ) AS source
        ON lower(btrim(target.environment_code)) = lower(source.environment_code)
        WHEN MATCHED THEN UPDATE SET
          environment_name = source.environment_name,
          environment_description = source.environment_description,
          is_active = source.is_active,
          updated_time = CURRENT_TIMESTAMP,
          updated_by = CURRENT_USER
        WHEN NOT MATCHED THEN INSERT (
          environment_code, environment_name, environment_description, is_active
        ) VALUES (
          source.environment_code, source.environment_name,
          source.environment_description, source.is_active
        );

