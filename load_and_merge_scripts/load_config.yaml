  - workbook: users_security.xlsx
    sheet: Principal
    schema: security
    table: principal
    dependency_order: 240
    columns:
      - principal_type
      - principal_display_name
      - principal_description
      - principal_email
      - service_principal_application_id
      - service_principal_type
      - is_super_admin
      - is_active
    required_columns: [principal_type, principal_display_name]
    source_key:
      - principal_type
      - principal_email
      - service_principal_application_id
    merge_statements:
      - |
        MERGE INTO security.principal AS target
        USING (
          SELECT
            lower(btrim(staged.principal_type::text)) AS principal_type,
            btrim(staged.principal_display_name::text) AS principal_display_name,
            NULLIF(btrim(staged.principal_description::text), '') AS principal_description,
            NULLIF(btrim(staged.principal_email::text), '') AS principal_email,
            NULLIF(btrim(staged.service_principal_application_id::text), '')::uuid AS service_principal_application_id,
            NULLIF(btrim(staged.service_principal_type::text), '') AS service_principal_type,
            COALESCE(NULLIF(btrim(staged.is_super_admin::text), '')::boolean, FALSE) AS is_super_admin,
            COALESCE(NULLIF(btrim(staged.is_active::text), '')::boolean, TRUE) AS is_active
          FROM {staging_table} AS staged
        ) AS source
        ON (
          source.principal_type = 'user'
          AND target.principal_type = 'user'
          AND lower(btrim(target.principal_email)) = lower(source.principal_email)
        ) OR (
          source.principal_type = 'service_principal'
          AND target.principal_type = 'service_principal'
          AND target.service_principal_application_id = source.service_principal_application_id
        )
        WHEN MATCHED THEN UPDATE SET
          principal_display_name = source.principal_display_name,
          principal_description = source.principal_description,
          principal_email = source.principal_email,
          service_principal_application_id = source.service_principal_application_id,
          service_principal_type = source.service_principal_type,
          is_super_admin = source.is_super_admin,
          is_active = source.is_active,
          updated_time = CURRENT_TIMESTAMP,
          updated_by = CURRENT_USER
        WHEN NOT MATCHED THEN INSERT (
          principal_type, principal_display_name, principal_description,
          principal_email, service_principal_application_id,
          service_principal_type, is_super_admin, is_active
        ) VALUES (
          source.principal_type, source.principal_display_name,
          source.principal_description, source.principal_email,
          source.service_principal_application_id, source.service_principal_type,
          source.is_super_admin, source.is_active
        );

