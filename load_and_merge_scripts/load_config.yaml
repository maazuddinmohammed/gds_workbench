  - workbook: foundational.xlsx
    sheet: Tenant
    schema: core
    table: tenant
    dependency_order: 220
    columns:
      - project_code
      - tenant_code
      - tenant_name
      - tenant_description
      - tenant_catalog
      - gds_admin_catalog
      - gds_connection_tenant_code
      - gds_connection_system_code
      - gds_connection_code
      - tenant_visibility
      - is_active
    required_columns:
      - project_code
      - tenant_code
      - tenant_name
      - tenant_catalog
      - gds_admin_catalog
    source_key: [tenant_code]
    merge_statements:
      - |
        MERGE INTO core.tenant AS target
        USING (
          SELECT
            project.project_id,
            btrim(staged.tenant_code::text) AS tenant_code,
            btrim(staged.tenant_name::text) AS tenant_name,
            NULLIF(btrim(staged.tenant_description::text), '') AS tenant_description,
            btrim(staged.tenant_catalog::text) AS tenant_catalog,
            btrim(staged.gds_admin_catalog::text) AS gds_admin_catalog,
            COALESCE(NULLIF(btrim(staged.tenant_visibility::text), ''), 'private') AS tenant_visibility,
            COALESCE(NULLIF(btrim(staged.is_active::text), '')::boolean, TRUE) AS is_active
          FROM {staging_table} AS staged
          JOIN core.project AS project
            ON lower(btrim(project.project_code)) = lower(btrim(staged.project_code::text))
        ) AS source
        ON lower(btrim(target.tenant_code)) = lower(source.tenant_code)
        WHEN MATCHED THEN UPDATE SET
          project_id = source.project_id,
          tenant_name = source.tenant_name,
          tenant_description = source.tenant_description,
          tenant_catalog = source.tenant_catalog,
          gds_admin_catalog = source.gds_admin_catalog,
          tenant_visibility = source.tenant_visibility,
          is_active = source.is_active,
          updated_time = CURRENT_TIMESTAMP,
          updated_by = CURRENT_USER
        WHEN NOT MATCHED THEN INSERT (
          project_id, tenant_code, tenant_name, tenant_description,
          tenant_catalog, gds_admin_catalog, tenant_visibility, is_active
        ) VALUES (
          source.project_id, source.tenant_code, source.tenant_name,
          source.tenant_description, source.tenant_catalog,
          source.gds_admin_catalog, source.tenant_visibility, source.is_active
        );
    deferred_statements:
      - |
        MERGE INTO core.tenant AS target
        USING (
          SELECT
            btrim(staged.tenant_code::text) AS tenant_code,
            CASE
              WHEN NULLIF(btrim(staged.gds_connection_tenant_code::text), '') IS NULL
               AND NULLIF(btrim(staged.gds_connection_system_code::text), '') IS NULL
               AND NULLIF(btrim(staged.gds_connection_code::text), '') IS NULL
                THEN NULL
              WHEN connection.connection_id IS NOT NULL
                THEN connection.connection_id
              ELSE ('unresolved_reference_' || staged.tenant_code::text)::bigint
            END AS gds_connection_id
          FROM {staging_table} AS staged
          LEFT JOIN core.tenant AS connection_tenant
            ON NULLIF(btrim(staged.gds_connection_tenant_code::text), '') IS NOT NULL
           AND lower(btrim(connection_tenant.tenant_code)) =
               lower(btrim(staged.gds_connection_tenant_code::text))
          LEFT JOIN core.system AS connection_system
            ON NULLIF(btrim(staged.gds_connection_system_code::text), '') IS NOT NULL
           AND lower(btrim(connection_system.system_code)) =
               lower(btrim(staged.gds_connection_system_code::text))
          LEFT JOIN core.connection AS connection
            ON connection.tenant_id = connection_tenant.tenant_id
           AND connection.system_id = connection_system.system_id
           AND lower(btrim(connection.connection_code)) =
               lower(btrim(staged.gds_connection_code::text))
        ) AS source
        ON lower(btrim(target.tenant_code)) = lower(source.tenant_code)
        WHEN MATCHED THEN UPDATE SET
          gds_connection_id = source.gds_connection_id,
          updated_time = CURRENT_TIMESTAMP,
          updated_by = CURRENT_USER;

