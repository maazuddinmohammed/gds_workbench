[project]
name = "gds-workbench-api"
version = "0.1.0"
description = "GDS Workbench FastAPI backend"
requires-python = ">=3.14,<3.15"
dependencies = [
    "azure-identity==1.25.3",
    "databricks-sdk==0.133.0",
    "fastapi==0.141.1",
    "gds-etl-workbench-mcp==0.2.0",
    "langchain==1.3.15",
    "langchain-openai==1.5.1",
    "openai-agents==0.22.0",
    "openpyxl==3.1.5",
    "psycopg[binary]==3.3.4",
    "psycopg-pool==3.3.1",
    "pydantic==2.13.4",
    "sqlglot==30.13.0",
    "uvicorn==0.51.0",
]

[project.scripts]
gds-workbench-worker = "gds_workbench_api.workflow_worker:main"

[tool.uv.sources]
gds-etl-workbench-mcp = { path = "../../mcp_server", editable = false }

[dependency-groups]
dev = [
    "httpx2==2.10.0",
    "pyright==1.1.411",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.22",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["../..", "../../mcp_server"]
testpaths = ["../../tests/web_backend"]

[tool.ruff]
line-length = 100
# This source is copied into DBR 16.4 notebooks, which run Python 3.12.
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC"]

[tool.pyright]
include = ["gds_workbench_api", "gds_workbench_runtime", "../../tests/web_backend"]
extraPaths = ["../..", "../../tests/web_backend", "../../mcp_server"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gds_workbench_api", "gds_workbench_runtime"]
